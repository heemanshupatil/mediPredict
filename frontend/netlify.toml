[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  VITE_API_URL = "https://medi-predict-api.vercel.app/api"

# Redirect /api/* to the hosted Flask backend so the SPA can talk to it.
[[redirects]]
  from = "/api/*"
  to = "https://medi-predict-api.vercel.app/api/:splat"
  status = 200
  force = true